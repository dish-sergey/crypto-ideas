# Приложение без веба: планировщик коллекторов + CLI backfill
spring.main.web-application-type=none

# --- Хранилище ---
data.db-path=data/crypto.db

# --- Вселенная символов ---
# Дневные свечи качаются для всех; минутные — только для minute-symbols (объём!)
collectors.symbols=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT
collectors.minute-symbols=BTCUSDT,ETHUSDT
# Дневные свечи для breadth-компонента детектора (C5, док. 01): топ-N монет из
# universe_snapshot ∩ торгуемые USDT-пары Binance. 0 = выключено.
collectors.universe-candles-top=100
collectors.okx-instruments=BTC-USDT-SWAP,ETH-USDT-SWAP
# Kraken Futures (linear perpetual, площадка шорт-ноги S1-lite — док. 09 §2.9)
collectors.kraken-symbols=PF_XBTUSD,PF_ETHUSD

# --- On-chain (Coin Metrics Community) ---
# CapRealUSD исключена: с 2026 недоступна в community-тарифе (HTTP 403).
# Realized cap выводится на чтении: CapRealUSD = CapMrktCurUSD / CapMVRVCur.
collectors.onchain-assets=btc,eth
collectors.onchain-metrics=CapMVRVCur,CapMrktCurUSD,SplyCur,PriceUSD

# --- Macro (FRED) ---
collectors.fred-series=DFF,WALCL,DTWEXBGS,CPIAUCSL

# --- News RSS ---
collectors.rss-feeds=https://www.coindesk.com/arc/outboundfeeds/rss,https://cointelegraph.com/rss,https://www.theblock.co/rss.xml,https://decrypt.co/feed

# --- Стенд маркет-мейкинга Revolut X (ТЗ — docs/63-...) ---
# ТЗ §2: все параметры — только из конфига. Переопределяются аргументом запуска,
# например --revx.max-requests-per-second=6, и попадают в запись прогона.
revx.db-path=data/revx.db
revx.base-url=https://revx.revolut.com
revx.region=EEA
revx.book-depth=5
# Потолок темпа ИЗМЕРЕН (--revx-probe-limits, 19.08.2026): лимит глобальный по IP,
# последняя чистая ступень 1.0 req/s, устойчивый 429 с 1.25 req/s. 0.8 = запас 20%.
# Следствие: полный обход 46 ног занимает ~58 с — опрос всей вселенной раз в 5 с
# (ТЗ §3.4) физически невозможен с одного адреса, нужен ярусный план.
revx.max-requests-per-second=0.8
# Залп запрещён (ёмкость 1): площадка ограничивает МИНИМАЛЬНЫЙ ИНТЕРВАЛ между
# запросами, а не средний темп — два запроса встык дают 429 на втором при любой
# паузе между парами (замер 19.08.2026, паузы 2.5/4/6 с — всегда ровно 50%).
revx.burst-capacity=1
# --- Авторизованный путь (ключ Revolut X, право ТОЛЬКО НА ЧТЕНИЕ) ---
# Лимиты площадки для авторизованных эндпоинтов: 100 токенов/с и 1000/мин против
# 1/с публично. Держим 9 req/s = 540/мин: этого хватает на все 23 пары каждые 5 с
# (46 запросов), как и требовал ТЗ §3.4, с запасом до минутного потолка.
# Ключей нет — приложение молча остаётся на публичном пути со своими 0.8 req/s.
# 46 запросов книг на 5-секундный цикл = 9.2 req/s, плюс сделки — на 9 req/s
# планировщик отставал ровно на период (замер на ARM). 12 = 720/мин при лимите 1000.
revx.auth.max-requests-per-second=12
revx.auth.burst-capacity=4
revx.auth.api-key-file=keys/api_key.txt
revx.auth.private-key-file=keys/private.pem
# С ключом ярусы не нужны: вся вселенная опрашивается раз в 5 с (ТЗ §3.4),
# 46 запросов на цикл = 552/мин при лимите 1000/мин.
revx.auth.book-period-seconds=5
revx.auth.trades-period-seconds=60
# Воркеры сбора. Узкое место — не лимит, а задержка ответа (~200 мс): при одном
# потоке обход 23 пар занимал ~9.5 с вместо 5 (замер на ARM 19.08.2026).
# Публично воркер один: там всё равно один запрос в секунду.
revx.workers=1
revx.auth.workers=8
# Порог из ТЗ §3.3: залпом ноги расходятся на миллисекунды, 250 мс снова осмысленны.
revx.auth.skew-threshold-ms=250
revx.max-retries=3
revx.request-timeout-seconds=15
# Снимок пары с расхождением времён получения больше порога исключается из
# расчёта базиса, но сохраняется с флагом (ТЗ §3.3). ТЗ просило 250 мс — с одного
# IP недостижимо (см. выше), ноги неизбежно расходятся на период бакета ~1.25 с.
# Измерено на 296 снимках: p50=1250 мс, p95=1278, max=1605. Порог 2000 ловит
# затыки сети и ретраи, а не штатное расстояние между ногами.
revx.skew-threshold-ms=2000
revx.quote-currency=USDC
revx.reference-quote=USD
# Мемкоины в расчёт курса USDC/USD не входят (ТЗ §4.1), котироваться могут.
revx.memecoins=DOGE,SHIB,PEPE,BONK,TRUMP
# Порядок обхода вселенной: сначала пары с максимальным разрывом спредов (док. 62 §8).
revx.priority=ETH,BTC,SOL,BNB,AVAX,LINK,XRP
revx.trades-page-limit=100

# Ярусы опроса. Вынужденная замена «20 пар каждые 5 с» из ТЗ §3.4: при потолке
# ~1 req/s полный обход 46 ног занимает ~58 с. Честно симулировать можно только
# ярус 1; ярусы 2-3 нужны для раздела «Рынок» отчёта (спреды, базис, поток).
# Расчётная нагрузка ≈ 0.71 req/s при потолке 0.8.
revx.tier1=ETH,BTC
revx.tier2=SOL,BNB,AVAX,LINK,XRP,SUI
revx.book-period-tier1-seconds=10
revx.book-period-tier2-seconds=90
revx.book-period-tier3-seconds=600
revx.trades-period-tier1-seconds=60
revx.trades-period-other-seconds=900
revx.pairs-refresh-hours=24
# Страниц ленты за один заход. Длинная докачка (первое заполнение — до 13 страниц
# на пару) размазывается по заходам и продолжается с сохранённого курсора: иначе
# один заход забирает бюджет на полминуты и ярус 1 опаздывает на 10-17 с.
revx.trades-pages-per-run=3
revx.trades-backfill-max-hours=24
revx.health-file=data/revx-health.txt

# --- Справедливая цена и предохранители (ТЗ §4.1) ---
# Курс USDC/USD = медиана implied по неммемкоин-парам. Гейт общий: мало пар или
# большой разброс — котирование стоит целиком.
revx.fair.min-pairs=8
revx.fair.max-dispersion-pct=0.10
# Попарный гейт — не из ТЗ, а из замера 19.08.2026: на движении ETH в 18% опорная
# книга ETH/USD раздвинулась до 1.18% (BTC/USD тогда же 0.016%), а implied по ETH
# ушёл на −3.5%. Медиана при этом здорова, и общий гейт молчал бы.
revx.fair.max-reference-spread-pct=0.20
revx.fair.max-residual-pct=0.50
# Снимки с разъехавшимися ногами в базис не идут (в базе остаются с флагом).
revx.fair.max-skew-ms=250

# --- Параметры симуляции (ТЗ §4.2, §4.7) ---
# Заданы ДО прогонов и по логике, а не подобраны по результату (ТЗ §8).
#
# ⚠️ ИСКЛЮЧЕНИЕ, которое надо помнить при чтении любых чисел: отступ 0.14% ВЫБРАН
# ПО ДАННЫМ, на окне 20–25.08.2026, по метрике «край × оборот» (док. 80). Прежнее
# значение 0.0004 задавалось до прогонов из расчёта док. 62 §4 и оказалось втрое
# у́же самой книги: пассивная сторона площадки стоит в 15.7 б.п. от справедливой
# цены, то есть все ранние прогоны шли там, где мы котируем у́же рынка.
#
# Следствие по ТЗ §8: результаты на 0.14% — ВНУТРИВЫБОРОЧНЫЕ, то есть верхняя
# граница. Проверка возможна только на следующем чистом окне (семь суток, ~31.08),
# которого выбор не видел. До неё все выводы по этой точке — предварительные.
revx.sim.offset=0.0014
revx.sim.size=0.05
revx.sim.inventory-cap=0.25
# Скос 0.10% — ВЫБРАН ПО ДАННЫМ на окне 20–25.08.2026, как и отступ (см. выше).
# Решает не край, а долю времени с полным инвентарём: при 0.02% бид не выставлялся
# 22.9% времени по BTC, при 0.10% — 2.2%. «Край × оборот» при этом не меняется
# (959.6 против 991.0, разброс по ступеням ±6%), а средний инвентарь падает вдвое.
# NB: прирост «+26%» из док. 82 §3 получен в предположении «оборот пропорционален
# числу исполнений». Средний филл по ступеням падает с 650 до 542, оборот растёт
# на 17% против 40% у числа исполнений — настоящий прирост 3%, а не 26%.
revx.sim.skew-k=0.001
revx.sim.requote-threshold=0.00005
# maker 0% — действующий тариф площадки; лестница проверяет, где конструкция умирает.
revx.sim.maker-fee=0.0
revx.sim.fee-ladder=0.0,0.0001,0.0002,0.0005
# Пессимистичный прогон: промо отменили (0.02%) и ещё в полтора раза хуже.
revx.sim.pessimistic-fee=0.0003
# Лестница расширена вверх после замера: вся пассивная сторона площадки стоит
# в среднем в 15.7 б.п. от справедливой цены, то есть ступени до 10 б.п. щупали
# только узкий конец диапазона (док. 79 §5 + FlowReport).
revx.sim.offset-ladder=0.0004,0.0006,0.001,0.0012,0.0016,0.002
# Лестница скоса. Скос действует не через цену исполнения, а через момент
# (док. 79 §7): захват при его выключении не меняется, меняется markout.
# Лестница потолка инвентаря — множители к revx.sim.inventory-cap. Отвечает на
# вопрос ёмкости: где механическое насыщение (перестаём упираться в потолок).
# ВАЖНО: рыночного влияния модель не видит вовсе, поэтому это верхняя граница
# ёмкости, а не ёмкость.
revx.sim.cap-ladder=0.5,2.0,4.0,8.0
revx.sim.skew-ladder=0.0,0.0002,0.0004,0.0006,0.0015
# Любая случайность — только с фиксированным seed (ТЗ §7).
revx.sim.random-seed=20260820
# Контроль случайных котировок гоняется по N seed'ам: один seed — это монетка (док. 75 §4)
revx.sim.random-seeds=20
# Замер лимита: ступени темпа до первого устойчивого 429. Шаг мелкий, потому что
# первый замер (19.08.2026) поймал 429 уже на 2 req/s — лимит глобальный по IP
# и лежит около единиц запросов в секунду, а не десятков.
revx.probe.start-rps=0.5
revx.probe.step-rps=0.25
revx.probe.max-rps=3
revx.probe.dwell-seconds=30
revx.probe.cooldown-seconds=20
revx.probe.fail-ratio=0.01

# --- WS-ликвидации ---
collectors.liq-binance-enabled=true
# Bybit: allLiquidation пер-символьный. true = подписка на все linear-перпы рынка
# (список тянется с REST на каждом коннекте); false = только liq-bybit-symbols ниже.
collectors.liq-bybit-all-symbols=true
collectors.liq-bybit-symbols=BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT

# --- Счётные стенды теории оптимальности (ТЗ docs/65–68) ---
# ТЗ §2: все параметры стратегий, издержек и порогов — только отсюда.
# Любой переопределяется аргументом запуска и попадает в запись прогона.
theory.db-path=data/theory.db

# Датасет событий S5 (общий для ТЗ 65 и 66). Кэш DefiLlama emissions снят до
# перевода API на платный тариф — заново его не собрать (CLAUDE.md).
theory.s5.cache-dir=%TEMP%/s5cache
theory.s5.import-min-pct=0.02
theory.s5.price-from=2020-01-01

# --- ТЗ 65: аллокатор поверх пула стратегий ---
theory.alloc.from=2020-01-01
# Пул ФИКСИРОВАН ДО ПРОГОНА (§8): исключать по результату нельзя.
theory.alloc.pool=S1,S2S9,S3,S4,S5,S6,S7
# Исключённые из пула с причиной — идут в отчёт отдельной строкой.
# Значение — ASCII: .properties читаются в ISO-8859-1 (java.util.Properties),
# кириллица в ЗНАЧЕНИИ превращается в мусор в отчёте. В комментариях — можно.
# S12: PIT-вселенная перпов (833 символа funding) в локальной базе отсутствует —
# кривую строить не на чем; это ограничение данных, а не отбор по результату.
theory.alloc.excluded=S12:no offline data (PIT funding for 833 perps is available only from live fapi, doc 43)
theory.alloc.cost=0.001
theory.alloc.switch-cost=0.0015
theory.alloc.s1-gate-per-8h=0.0001
theory.alloc.s1-switch-cost=0.002
theory.alloc.s1-rebalance-k=0.0006
theory.alloc.s2s9-lookback=30
theory.alloc.s2s9-hold=7
theory.alloc.s2s9-top=10
theory.alloc.s2s9-min-history=250
theory.alloc.s2s9-min-universe=20
theory.alloc.s3-window=20
theory.alloc.s3-entry=1.0
theory.alloc.s4-yields=2019:0.08,2021:0.06,2023:0.05
theory.alloc.s5-min-pct=0.03
theory.alloc.s5-lead=5
theory.alloc.s5-stop=0.30
theory.alloc.s5-max-funding-cost=0.015
theory.alloc.s5-trade-cost=0.0019
theory.alloc.s5-slippage=0.01
theory.alloc.s6-steps=5
theory.alloc.s6-step-drop=0.08
theory.alloc.s7-crash-threshold=-0.06
# η берётся из теории (η* = √(8 ln N / T)); множитель — только для сетки чувствительности (§8)
theory.alloc.hedge-eta-multiplier=1.0
theory.alloc.hedge-window=0
theory.alloc.lazy-threshold=0.10
theory.alloc.eg-eta=0.05
theory.alloc.ons-beta=1.0
theory.alloc.ons-epsilon=1.0
theory.alloc.seed=42
theory.alloc.random-redraw-days=1
theory.alloc.best-fixed-iterations=4000
theory.alloc.best-fixed-step=1.0
# Контроль «выбор весов против случайной диверсификации»: сколько случайных
# ПОСТОЯННЫХ миксов прогонять для распределения (ежедневный RANDOM меряет churn).
theory.alloc.random-fixed-draws=200

# --- ТЗ 66: размер позиции S5 (Kelly с усадкой) ---
# Стенд НЕ меняет конфигурацию идущего микро-live: правило одного изменения.
theory.kelly.min-pct=0.03
theory.kelly.lead=5
# Стоп: 0.30 — как в измеренной модели док. 52 и в live; док. 02 v2 называет 8%,
# расхождение разрешается сеткой stop-grid, а не выбором «удобного» значения.
theory.kelly.stop=0.30
theory.kelly.stop-grid=0.08,0.20,0.30,0.50
theory.kelly.max-funding-cost=0.015
theory.kelly.trade-cost=0.0019
theory.kelly.slippage=0.01
theory.kelly.from=2020-01-01
theory.kelly.bootstrap=10000
theory.kelly.seed=42
theory.kelly.monte-carlo-paths=20000
theory.kelly.ruin-threshold=0.50
theory.kelly.current-limit=0.02
theory.kelly.max-concurrent=3
# Честный N проверенных гипотез из журнала проекта (S1–S12) — для поправки на отбор.
theory.kelly.tested-hypotheses=12
theory.kelly.prior-strengths=0.5,1.0,2.0,5.0
# Сетка размеров: от текущего лимита до области обрыва темпа роста — чтобы в
# таблице было видно и плато слева от оптимума, и обрыв справа (ТЗ 66 §5.2).
theory.kelly.size-grid=0.005,0.01,0.02,0.03,0.05,0.10,0.20,0.50,1.00,1.50,2.00
# Портфельный лимит просадки, из которого выводится потолок на позицию при
# наблюдённой кластеризации (док. 52 §3.3: 18 одновременных → ≤4.5% на позицию).
theory.kelly.portfolio-dd-limit=0.25

# --- ТЗ 67: калибровка и допуск OU (предтест блока B) ---
# Пороги фиксированы ДО прогона и не смягчаются, если ничего не прошло (§8).
theory.ou.level=0.05
# 0 — автоматический выбор полосы по правилу Шверта: 4·(n/100)^0.25.
# Фиксированный лаг 1 занижал долгосрочную дисперсию и отвергал стационарность
# на настоящем OU (поймано контролем POS_SYN).
theory.ou.lags=0
theory.ou.bootstrap=2000
theory.ou.seed=42
theory.ou.kappa-window=250
theory.ou.kappa-cv-threshold=0.50
theory.ou.min-episodes=30
# Порог T4: сдвиг уровня считается малым, если он меньше σ самих отклонений.
# Калибровка по синтетическому контролю с ИЗВЕСТНЫМ отсутствием разрыва: при 0.5σ
# настоящий OU проваливал T4 (sup-Wald чувствителен к персистентности даже после
# поправки на автокорреляцию). Порог настроен на контроле, не на реальных данных.
theory.ou.break-to-sigma=1.0
# Окно применимости: горизонт, на котором проект готов держать позицию.
# Второе условие T2 — без него медленный OU с длинными эпизодами проходил бы формально.
theory.ou.holding-horizon-days=30
theory.ou.ols-mle-divergence=0.30
theory.ou.basis-threshold=0.004
# Порог рассинхронизации: ТЗ требует 250 мс, но синхронных снимков одной площадки
# у проекта нет — берём 60 с и явно помечаем это отклонением в отчёте.
theory.ou.basis-skew-tolerance-ms=60000
theory.ou.depeg-threshold=0.995
theory.ou.depeg-min-hours=1
theory.ou.funddiff-threshold=0.0008
theory.ou.pair-z-threshold=1.0
theory.ou.pair-window=60
theory.ou.from=2019-01-01

# --- ТЗ 68: полоса бездействия и граница разорения ---
# Сетка сравнения §4.3 (ε — издержки с оборота, σ — годовая волатильность).
theory.band.epsilon-grid=0.0001,0.0005,0.0010,0.0015,0.0020,0.0050
theory.band.sigma-grid=0.4,0.6,0.8,1.0
theory.band.pi-star-grid=0.2,0.4,0.6,0.8
theory.band.gamma-grid=1,2,5
theory.band.grid-points=200
theory.band.band-steps=20
# Импульсный вариант считается симуляцией: шаг 1/252 года, горизонт ~40 лет.
theory.band.impulse-steps=10000
theory.band.impulse-paths=8
theory.band.impulse-dt=0.003968
theory.band.impulse-grid-steps=4
# Фактические фиксированные издержки проекта: вывод 1–3 GBP на счёте ~1000 GBP.
theory.band.fixed-cost-shares=0.0,0.001,0.002,0.003
theory.band.seed=42
theory.band.mc-paths=20000
theory.band.block-size=20
theory.band.block-grid=1,5,20,60
theory.band.ruin-threshold=0.50
theory.band.ruin-horizon-days=1825
theory.band.ladder-step-drop=0.08
theory.band.ladder-steps=5
# Горизонт лестницы S6 — ОСЬ ЧУВСТВИТЕЛЬНОСТИ, а не свойство стратегии: в док. 02 v2
# срока нет («позиция на следующий цикл»), поэтому навязывать один горизонт нельзя
# (П6 док. 71). Первый в списке используется в сводных строках отчёта.
theory.band.ladder-horizon-days=180
theory.band.ladder-horizon-grid=90,180,365,730
theory.band.inventory-imbalance=0.02
theory.band.inventory-ceiling=50
theory.band.inventory-steps=5000
theory.band.s5-size=0.02
theory.band.s5-concurrent=3
theory.ou.basis-from=2025-08-01
