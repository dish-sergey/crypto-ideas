<script>
(function(){
  const RAW = JSON.parse(document.getElementById('data').textContent);
  const P = RAW.points;   // [date, price, label, sma200, cusum, rules2d]
  const STATES=["BULL","RANGE","BEAR","TRANSITION"];
  const RIBS=[["эталон",2],["baseline_sma200",3],["cusum",4],["rules2d",5]];
  const css=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const stColor=i=>[css('--bull'),css('--range'),css('--bear'),css('--trans')][i];
  document.getElementById('range').textContent=RAW.from+" — "+RAW.to+" · "+P.length+" дней";
  document.getElementById('legend').innerHTML=STATES.map((s,i)=>"<span><i class='sw' style='background:"+stColor(i)+"'></i>"+s+"</span>").join("");
  const cv=document.getElementById('c'),ctx=cv.getContext('2d'),tip=document.getElementById('tip');
  let W=0,H=0,dpr=1; const PAD={l:110,r:12,t:10,b:22},GAP=10,RIB=22;
  const prices=P.map(p=>p[1]),pMin=Math.min(...prices),pMax=Math.max(...prices),lg=v=>Math.log10(v);
  let priceTop,priceBot,ribsTop,plotW;
  function layout(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=520;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);priceTop=PAD.t;ribsTop=H-PAD.b-RIBS.length*RIB;priceBot=ribsTop-GAP;plotW=W-PAD.l-PAD.r;}
  const x=i=>PAD.l+(P.length<2?0:plotW*i/(P.length-1));
  const yP=v=>priceBot-(priceBot-priceTop)*(lg(v)-lg(pMin))/(lg(pMax)-lg(pMin));
  function bands(col,top,bot){let i0=0;for(let i=1;i<=P.length;i++){if(i===P.length||P[i][col]!==P[i0][col]){
    ctx.fillStyle=stColor(P[i0][col]);const xa=x(i0),xb=x(Math.min(i,P.length-1));ctx.fillRect(xa,top,xb-xa,bot-top);i0=i;}}}
  function draw(){layout();ctx.clearRect(0,0,W,H);const grid=css('--grid'),muted=css('--muted');
    ctx.font="11px system-ui";ctx.textBaseline="middle";ctx.strokeStyle=grid;ctx.fillStyle=muted;ctx.lineWidth=1;
    priceTicks(pMin,pMax).forEach(t=>{const y=yP(t);ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();
      ctx.textAlign="right";ctx.fillStyle=muted;ctx.fillText(fmtP(t),PAD.l-6,y);});
    let py=-1;for(let i=0;i<P.length;i++){const y=+P[i][0].slice(0,4);if(y!==py){py=y;const xx=x(i);
      ctx.strokeStyle=grid;ctx.beginPath();ctx.moveTo(xx,priceTop);ctx.lineTo(xx,ribsTop+RIBS.length*RIB);ctx.stroke();
      ctx.fillStyle=muted;ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText(y,xx,ribsTop+RIBS.length*RIB+4);ctx.textBaseline="middle";}}
    ctx.strokeStyle=css('--price');ctx.lineWidth=1.6;ctx.beginPath();
    P.forEach((p,i)=>{const xx=x(i),yy=yP(p[1]);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy);});ctx.stroke();
    RIBS.forEach((r,k)=>{const top=ribsTop+k*RIB;bands(r[1],top,top+RIB-3);
      ctx.fillStyle=muted;ctx.textAlign="right";ctx.fillText(r[0],PAD.l-6,top+RIB/2);});}
  function priceTicks(lo,hi){const out=[];for(let e=Math.floor(lg(lo));e<=Math.ceil(lg(hi));e++){
    [1,2,5].forEach(m=>{const v=m*Math.pow(10,e);if(v>=lo*0.9&&v<=hi*1.1)out.push(v);});}return out;}
  function fmtP(v){return v>=1000?(v/1000)+"k":""+v;}
  function onMove(ev){const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left;
    if(mx<PAD.l||mx>W-PAD.r){tip.style.opacity=0;draw();return;}
    let i=Math.round((mx-PAD.l)/plotW*(P.length-1));i=Math.max(0,Math.min(P.length-1,i));const p=P[i];draw();
    const xx=x(i);ctx.strokeStyle=css('--muted');ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(xx,priceTop);ctx.lineTo(xx,ribsTop+RIBS.length*RIB);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=css('--price');ctx.beginPath();ctx.arc(xx,yP(p[1]),3.5,0,7);ctx.fill();
    tip.innerHTML="<div class='d'>"+p[0]+"</div><div class='row'><span>Цена</span><span>$"+p[1].toLocaleString('en-US',{maximumFractionDigits:0})+"</span></div>"+
      RIBS.map(r=>"<div class='row'><span>"+r[0]+"</span><span class='st-badge' style='background:"+stColor(p[r[1]])+"'>"+STATES[p[r[1]]]+"</span></div>").join("");
    tip.style.opacity=1;let tx=ev.clientX+14,ty=ev.clientY+14;
    if(tx+230>innerWidth)tx=ev.clientX-244;if(ty+200>innerHeight)ty=ev.clientY-200;tip.style.left=tx+"px";tip.style.top=ty+"px";}
  cv.addEventListener('mousemove',onMove);cv.addEventListener('mouseleave',()=>{tip.style.opacity=0;draw();});
  cv.addEventListener('touchmove',e=>{if(e.touches[0])onMove(e.touches[0]);},{passive:true});
  new ResizeObserver(draw).observe(cv);draw();
})();
