# Параметры стенда сравнения детекторов (док. 15 v4 §3).
# ЗАФИКСИРОВАНЫ ДО ПРОГОНА, коммитятся отдельно от результатов (§3, §11):
# так доказуемо, что числа не подбирались после того, как результаты увидели.
#
# CUSUM (кандидат cusum, §5.2) — два параметра, заданы СОДЕРЖАТЕЛЬНО, не оптимизацией:
#   delta — суточный «допуск» дрейфа в единицах лог-доходности. BTC: типичная дневная
#           |лог-доходность| ~0.04; delta=0.01 требует устойчивого однонаправленного
#           движения сильнее шумового порога, иначе накопитель не растёт.
#   h     — порог накопленного отклонения для срабатывания. h=0.15 ≈ ~15% совокупного
#           избыточного хода в одну сторону → переход в BULL/BEAR.
cusum.delta=0.01
cusum.h=0.15

